<!DOCTYPE html>

<style>
  :root{
    --paper:#FBF8F3; --card:#FFFFFF; --ink:#16181C; --ink-soft:#5C6169; --line:#E3DDD2;
    --oak:#9C5A21; --oak-bg:#F6EADC; --glaze:#22697C; --glaze-bg:#E1EEF1;
    --cash:#2C6B4A; --card-pay:#3B4C9B; --alert:#A63A2E; --warnbg:#FFF3E4;
    --r:14px; --shadow:0 1px 2px rgba(20,18,15,.06), 0 6px 18px rgba(20,18,15,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);

    padding-bottom:160px}
  .wrap{max-width:820px;margin:0 auto;padding:0 12px}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  .num{font-variant-numeric:tabular-nums}
  .danger{color:var(--alert)}
  .hide{display:none !important}

  header{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;padding:10px 0 6px}
  .mark{font-family:Georgia,"Times New Roman",serif;font-size:19px}
  .mark b{font-weight:400}
  button.evt{margin-left:auto;max-width:52%;padding:7px 11px;border:1px solid var(--line);border-radius:999px;
    background:var(--card);font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .datebar{display:flex;align-items:center;gap:7px;padding:0 0 8px}
  .datebar input[type=date]{padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:13.5px}
  .datebar .tbtn{padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:12.5px;font-weight:600}
  .datebar .dnote{font-size:12px;color:var(--oak);font-weight:600}
  .datebar.past input[type=date]{border-color:var(--oak);background:var(--oak-bg)}
  .tally{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);
    border-radius:10px;overflow:hidden;margin-bottom:8px}
  .tally div{background:var(--card);padding:7px 8px}
  .tally span{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
  .tally strong{font-size:17px;font-weight:600}
  nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;padding:8px 13px;border-radius:999px;font-size:13.5px;font-weight:600;
    color:var(--ink-soft);border:1px solid var(--line);background:var(--card)}
  nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  nav button .dot{display:inline-block;min-width:17px;padding:0 4px;margin-left:5px;border-radius:9px;
    background:var(--alert);color:#fff;font-size:11px;text-align:center}

  .tools{display:flex;gap:8px;padding:10px 0 6px}
  .tools input[type=search]{flex:1;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card)}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);
    font-size:13px;color:var(--ink-soft)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px;padding-bottom:16px}
  .prod{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:11px 11px 10px;min-height:104px;display:flex;flex-direction:column;box-shadow:var(--shadow)}

  .prod .cat{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}

  .prod .badge.out{background:#F8E5E2;color:var(--alert)}
  .prod.wood{border-left:4px solid var(--oak)} .prod.resin{border-left:4px solid var(--glaze)}
  .prod.dim{opacity:.5}
  .empty{padding:30px 10px;text-align:center;color:var(--ink-soft);font-size:14px}

  .sum .tot{margin-left:auto;font-size:21px;font-weight:700}

  .ghost{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;margin-top:8px}

  .split{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:6px 0 10px;background:var(--line)}

  .vs .col .d{font-size:12px;color:var(--ink-soft);margin-bottom:6px;min-height:15px}
  .vs .col .v{font-size:21px;font-weight:700}
  .vs .col ul{margin:6px 0 0;padding-left:15px;font-size:12.5px;color:var(--ink-soft)}
  .delta{font-size:12.5px;font-weight:700}
  .delta.up{color:var(--cash)} .delta.down{color:var(--alert)} .delta.flat{color:var(--ink-soft)}
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kpi div{border:1px solid var(--line);border-radius:11px;padding:9px 10px;background:var(--paper)}
  .kpi span{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft)}
  .kpi strong{font-size:18px;font-weight:700}
  .kpi small{font-size:11.5px;color:var(--ink-soft)}
  .drop{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;background:var(--paper);margin-top:8px}
  .drop b{display:block;font-size:14px}
  .drop span{font-size:12px;color:var(--ink-soft)}
  .toast{position:fixed;left:12px;right:12px;bottom:calc(150px + env(safe-area-inset-bottom));z-index:70;background:var(--ink);
    color:#fff;border-radius:12px;padding:12px 14px;display:none;align-items:center;gap:12px;max-width:796px;margin:0 auto;
    box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .toast.on{display:flex}
  .toast span{flex:1;font-size:13.5px}
  .toast button{color:#FFD9A8;font-weight:700;font-size:13.5px;text-decoration:underline}
  @media (prefers-reduced-motion:no-preference){.prod{transition:transform .07s}}
</style>

<header>

    </div>
    <div class="datebar" id="datebar">
      <input type="date" id="tdate" aria-label="Trading date">
      <button class="tbtn" id="todayBtn">Today</button>

    </div>
    <div class="tally" id="tally"></div>
    <nav id="nav"></nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="bar" id="bar">
  <div class="in">
    <div class="buyer hide" id="buyer"></div>
    <div class="lines hide" id="lines"></div>
    <div class="sum">
      <span class="cnt" id="cnt">Sale empty</span>
      <button class="link hide" id="toggleLines">Show items</button>
      <button class="link hide" id="clearSale">Clear</button>
      <span class="tot num" id="tot">£0.00</span>
    </div>
    <div class="pay">
      <button class="b-cash" id="payCash" disabled>CASH</button>
      <button class="b-card" id="payCard" disabled>CARD</button>
    </div>
  </div>
</div>

<div class="veil" id="veil"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="in" id="sheetIn"></div>
</section>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAct"></button></div>
<input type="file" id="filePick" accept=".csv,.tsv,.txt,.xlsx,.xls" class="hide">

/* ---------- storage: Claude's store, the browser's own, or memory ---------- */
const KEY='anornament_stall_v2';
async function kvGet(k){
  if(typeof window!=='undefined' && window.storage && window.storage.get){
    storageKind='app'; const r=await window.storage.get(k); return r && r.value;
  }
  if(typeof localStorage!=='undefined'){ storageKind='browser'; return localStorage.getItem(k); }
  return null;
}
async function kvSet(k,v){
  if(typeof window!=='undefined' && window.storage && window.storage.set){
    storageKind='app'; await window.storage.set(k,v); return;
  }
  if(typeof localStorage!=='undefined'){ storageKind='browser'; localStorage.setItem(k,v); return; }
  throw new Error('no storage');
}
const KEEP=['products','sales','moves','counts','batches','markets','event','tradeDate',
            'packs','defaultPack','costs','wishes','sale','saleMeta','deleted'];

    try{

      KEEP.forEach(k=>out[k]=state[k]);

    }catch(e){ storageOK=false; }

}
async function loadState(){
  try{
    const raw=await kvGet(KEY);
    if(raw){
      const d=JSON.parse(raw);
      KEEP.forEach(k=>{ if(d[k]!==undefined) state[k]=d[k]; });
      if(d.packVersion<PACK_VERSION) migratePacks();
    }
  }catch(e){ /* first run */ }
  if(!state.products.length) state.products=buildCatalogue();
  if(!state.packs.length) state.packs=DEFAULT_PACKS.slice();
  if(!state.tradeDate) state.tradeDate=todayKey();
  ['sales','moves','counts','batches','markets','wishes','sale'].forEach(k=>{ if(!Array.isArray(state[k])) state[k]=[]; });
  if(!state.costs) state.costs={};
  if(!state.deleted) state.deleted={sales:[],moves:[],counts:[],batches:[]};
  ['sales','moves','counts','batches'].forEach(k=>{ if(!Array.isArray(state.deleted[k])) state.deleted[k]=[]; });
  if(!state.saleMeta) state.saleMeta=blankMeta();
  seedMarkets();
}
function migratePacks(){
  const old=state.packs||[], at=id=>old.find(x=>x.id===id);
  state.packs=[{id:'pk-bag',name:'Bag + card + filling',cost:at('pk-bag')?at('pk-bag').cost:0.40},
               {id:'pk-box',name:'Box',cost:at('pk-box')?at('pk-box').cost:1.20}]
    .concat(old.filter(x=>!['pk-none','pk-bag','pk-box','pk-boxf'].includes(x.id)));
  if(!state.packs.find(x=>x.id===state.defaultPack)) state.defaultPack='';
}
function seedMarkets(){
  [...new Set(state.sales.filter(s=>s.channel!=='Online').map(s=>s.event).filter(Boolean))]
    .forEach(m=>{ if(!state.markets.includes(m)) state.markets.push(m); });
  if(state.event && !state.markets.includes(state.event)) state.markets.push(state.event);
}

/* ---------- the stock ledger ---------- */
/* move: {id, day, sku, loc:'home'|'trolley', qty:+/-, type, ref, note, batch} */
function addMove(m){
  state.moves.push({id:uid(), ...m});
  _stockVer++;
}
function moveSet(list){ list.forEach(addMove); }
function dropMoves(ref){ state.moves = state.moves.filter(m=>m.ref!==ref); _stockVer++; }

let _stockCache={key:'',map:null}, _stockVer=0;
function stockAsOf(day){
  const key=(day||'9999')+'|'+state.moves.length+'|'+_stockVer;
  if(_stockCache.key===key) return _stockCache.map;
  const map={};
  state.moves.forEach(m=>{
    if(day && m.day>day) return;
    const e = map[m.sku] || (map[m.sku]={home:0,trolley:0});
    e[m.loc] = (e[m.loc]||0) + (+m.qty||0);
  });
  _stockCache={key,map};
  return map;
}
function onHand(sku, loc, day){
  const e=stockAsOf(day)[sku];
  if(!e) return 0;
  return loc==='all' ? (e.home||0)+(e.trolley||0) : (e[loc]||0);
}
function trolleyQty(sku){ return onHand(sku,'trolley',null); }
function homeQty(sku){ return onHand(sku,'home',null); }

/* how fast a line sells, for cover and reorder */
function soldSince(sku, days){
  const cut=new Date(); cut.setDate(cut.getDate()-days);
  const from=todayKey(cut);
  let n=0;
  state.sales.forEach(s=>{ if(s.day>=from) s.lines.forEach(l=>{ if(l.sku===sku) n+=l.qty; }); });
  return n;
}
function weeksCover(sku){
  const rate=soldSince(sku,56)/8;                 // per week over the last eight weeks
  const have=onHand(sku,'all',null);
  if(!rate) return have>0 ? Infinity : 0;
  return have/rate;
}
function isLow(p){
  const have=onHand(p.sku,'all',null);
  if(p.noStock || p.active===false) return false;      // retired lines aren't worth making more of
  if(p.reorder>0) return have<=p.reorder;
  const c=weeksCover(p.sku);
  return c!==Infinity && c<3 && soldSince(p.sku,56)>0;
}
function stockValue(day, loc){
  let cost=0, retail=0;
  state.products.forEach(p=>{
    if(p.noStock) return;
    const q=onHand(p.sku, loc||'all', day);
    if(q<=0) return;
    cost += q*(+p.cost||0);
    retail += q*(+p.price||0);
  });
  return {cost, retail};
}

}

function bindSearch(id, setter, after){
  const el=document.getElementById(id);
  if(!el) return;
  el.oninput=e=>{
    const pos=e.target.selectionStart, y=window.scrollY;
    setter(e.target.value);
    (after||renderMain)();
    window.scrollTo(0,y);
    const n=document.getElementById(id);
    if(n){
      n.focus();
      try{ n.setSelectionRange(pos,pos); }catch(_){ }   // some browsers refuse this on type=search
    }
  };
}

  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{ ui.tab=b.dataset.tab; render(); window.scrollTo(0,0); });
}
function trolleyUnits(){
  let n=0; state.products.forEach(p=>{ const q=trolleyQty(p.sku); if(q>0) n+=q; });
  return n;
}

      <button class="opt" data-rm="${esc(m)}" style="padding:8px 12px">Remove</button>
    </div>`).join('') : '<p class="empty" style="padding:14px 0">No markets yet.</p>';
  openSheet(`

  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
    state.event=b.dataset.pick; ui.cmpA=''; ui.cmpB=''; save(); closeSheet(); render();
  });
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{

    state.markets.splice(i,1); if(state.event===m) state.event='';

    toast(`${m} removed from the list — its sales are untouched`,'Undo',()=>{
      state.markets.splice(i,0,m); state.event=m; save(); render(); });
  });
  const add=()=>{
    const v=document.getElementById('mkNew').value.trim(); if(!v) return;
    if(!state.markets.includes(v)) state.markets.push(v);
    state.event=v; ui.cmpA=''; ui.cmpB=''; save(); closeSheet(); render(); toast('Trading at '+v);
  };
  document.getElementById('mkAdd').onclick=add;
  document.getElementById('mkNew').onkeydown=e=>{ if(e.key==='Enter') add(); };
  document.getElementById('mkClose').onclick=closeSheet;
}

function salesIn(range, chan){
  const d=state.tradeDate, t=todayKey();
  let list=state.sales;
  if(chan && chan!=='all') list=list.filter(s=>(s.channel||'Market')===chan);
  if(range==='all') return list;
  if(range==='day') return list.filter(s=>s.day===d);
  if(range==='month') return list.filter(s=>s.day.slice(0,7)===t.slice(0,7));
  if(range==='ytd') return list.filter(s=>s.day.slice(0,4)===t.slice(0,4));
  if(range==='market'){
    const here=list.filter(s=>s.day===d && (s.event||'')===(state.event||''));
    if(here.length) return here;
    const ses=sessionsList()[0]; return ses?ses.sales:[];
  }
  return list;
}
function totalsOf(list){
  const t={total:0,cash:0,card:0,units:0,wood:0,resin:0,woodUnits:0,resinUnits:0,gross:0,disc:0,
           market:0,online:0,count:list.length};
  list.forEach(s=>{
    t.total+=s.total;
    t.gross+=(s.gross!=null?s.gross:s.total);
    t.disc+=(s.gross!=null?s.gross-s.total:0);
    if((s.channel||'Market')==='Online') t.online+=s.total; else t.market+=s.total;
    if(s.method==='Cash') t.cash+=s.total; else t.card+=s.total;
    s.lines.forEach(l=>{
      t.units+=l.qty;
      if(l.cat==='Resin'){ t.resin+=l.price*l.qty; t.resinUnits+=l.qty; }
      else { t.wood+=l.price*l.qty; t.woodUnits+=l.qty; }
    });
  });
  return t;
}
function sortSales(){
  state.sales.sort((a,b)=>{ const ka=a.day+(a.time||'00:00'), kb=b.day+(b.time||'00:00');
    return ka<kb?1:ka>kb?-1:0; });
}

/* ---------------- MARKET: selling ---------------- */
function productLines(){                      // SKUs grouped back into products for the grid
  const map=new Map();
  state.products.filter(p=>p.active!==false).forEach(p=>{
    const e=map.get(p.pid)||{pid:p.pid, name:p.name, group:p.group, cat:p.cat, optLabel:p.optLabel,
                             skus:[], price:p.price, trolley:0, home:0, noStock:p.noStock};
    e.skus.push(p);
    e.price=Math.min(e.price,p.price);
    e.trolley+=trolleyQty(p.sku); e.home+=homeQty(p.sku);
    map.set(p.pid,e);
  });
  return [...map.values()];
}

const PCTS=[5,10,15,20];
function openItemSheet(p, preset, idx){
  const listPrice = preset && preset.list!=null ? preset.list : p.price;
  const chosen={ qty:(preset&&preset.qty)||1, price:(preset&&preset.price)!=null?preset.price:p.price };
  const avail=trolleyQty(p.sku);
  const draw=()=>{
    const pct=listPrice>0&&chosen.price<listPrice?round2((1-chosen.price/listPrice)*100):0;
    openSheet(`
      <h3>${esc(fullName(p))}</h3>
      <div class="meta">${p.sku} · ${p.cat}${p.noStock?'':` · ${avail} in trolley · ${homeQty(p.sku)} at home`}</div>
      <div class="row2">
        <div><div class="lbl">Quantity</div>
          <div class="step"><button id="qMinus">−</button><b class="num" id="qVal">${chosen.qty}</b><button id="qPlus">+</button></div>
        </div>
        <div><div class="lbl">Price charged, each</div>
          <input class="field num" id="pVal" inputmode="decimal" value="${chosen.price||''}" placeholder="0.00"></div>
      </div>
      ${(!p.noStock && chosen.qty>avail && state.tradeDate===todayKey())?`<div class="warn" style="margin-top:10px">Only ${avail} of this in the trolley. Selling anyway is fine — the count will show as short and you can fix it at the next stock count.</div>`:''}
      <div class="lbl">Discount</div>
      <div class="opts">
        <button class="opt ${pct===0?'on':''}" data-pct="0">Full price</button>
        ${PCTS.map(x=>`<button class="opt ${Math.abs(pct-x)<0.01?'on':''}" data-pct="${x}">${x}% off</button>`).join('')}
      </div>
      <div class="row2" style="margin-top:8px">
        <input class="field num" id="pctVal" inputmode="decimal" placeholder="Other % off" value="${pct&&!PCTS.some(x=>Math.abs(pct-x)<0.01)?pct:''}">
        <button class="opt" id="applyPct" style="width:100%;text-align:center">Apply %</button>
      </div>
      ${listPrice&&chosen.price<listPrice?`<div class="note">${money(listPrice)} → <b>${money(chosen.price)}</b> each · ${pct.toFixed(0)}% off · saving ${money((listPrice-chosen.price)*chosen.qty)}</div>`:''}
      <button class="big" id="addBtn">${idx!=null?'Update line':'Add to sale'} · ${money(chosen.price*chosen.qty)}</button>
      <button class="ghost" id="cancelBtn">Cancel</button>
      ${idx!=null?'<button class="ghost danger" id="rmBtn">Remove from sale</button>':''}`);
    const readPrice=()=>{ const v=parseFloat(document.getElementById('pVal').value); if(!isNaN(v)) chosen.price=v; };
    document.getElementById('qMinus').onclick=()=>{ readPrice(); chosen.qty=Math.max(1,chosen.qty-1); draw(); };
    document.getElementById('qPlus').onclick=()=>{ readPrice(); chosen.qty++; draw(); };
    document.querySelectorAll('[data-pct]').forEach(b=>b.onclick=()=>{ chosen.price=round2(listPrice*(1-(+b.dataset.pct)/100)); draw(); });
    document.getElementById('applyPct').onclick=()=>{ const v=parseFloat(document.getElementById('pctVal').value);
      if(!isNaN(v)) chosen.price=round2(listPrice*(1-v/100)); draw(); };
    document.getElementById('pVal').onchange=()=>{ readPrice(); draw(); };
    document.getElementById('cancelBtn').onclick=closeSheet;
    const rm=document.getElementById('rmBtn');
    if(rm) rm.onclick=()=>{ state.sale.splice(idx,1); save(); closeSheet(); renderBar(); renderMain(); };
    document.getElementById('addBtn').onclick=()=>{
      readPrice();
      if(idx!=null){ state.sale[idx]={...state.sale[idx], price:chosen.price||0, qty:chosen.qty, list:listPrice};
        save(); closeSheet(); renderBar(); renderMain(); }
      else { addLine(p, chosen.price||0, chosen.qty, listPrice); closeSheet(); }
    };
  };
  draw();
}
function addLine(p, price, qty, listPrice){
  const list=listPrice!=null?listPrice:p.price;
  const same=state.sale.find(l=>l.sku===p.sku && l.price===price);
  if(same) same.qty+=qty;
  else state.sale.push({sku:p.sku, pid:p.pid, name:p.name, variant:p.variant, cat:p.cat, group:p.group, price, qty, list});
  save(); renderBar(); renderMain();
  toast(`${qty} × ${fullName(p)} added`,'Undo',()=>{
    const l=state.sale.find(l=>l.sku===p.sku && l.price===price);
    if(l){ l.qty-=qty; if(l.qty<=0) state.sale.splice(state.sale.indexOf(l),1); }
    save(); renderBar(); renderMain();
  });
}

/* ---------------- trolley ---------------- */
function openTrolleySheet(){
  const lines=state.products.filter(p=>!p.noStock && p.active!==false);
  const shown=lines.filter(p=>trolleyQty(p.sku)>0 || homeQty(p.sku)>0 || ui.invAll);
  openSheet(`
    <h3>The trolley</h3>
    <div class="meta">What you loaded in the car, ${dayLabel(state.tradeDate)}. Moving a piece here takes it out of home stock; selling takes it out of the trolley.</div>
    <div class="opts" style="margin-bottom:8px">
      <button class="opt" id="trAll">${ui.invAll?'Only pieces with stock':'Show every line'}</button>
      <button class="opt" id="trCopy">Copy last load</button>
      <button class="opt danger" id="trHome">Bring it all home</button>
    </div>
    <div style="max-height:52vh;overflow:auto">
      ${shown.length?shown.map(p=>{
        const t=trolleyQty(p.sku), h=homeQty(p.sku);
        return `<div class="ln">
          <div class="t"><b>${esc(fullName(p))}</b><span>${p.sku} · ${h} at home · <b>${t} in trolley</b></span></div>
          <div class="step"><button data-tm="${p.sku}">−</button><b class="num">${t}</b><button data-tp="${p.sku}">+</button></div>
        </div>`;}).join('') : '<p class="empty">No stock recorded yet. Add it in the Inventory tab first.</p>'}
    </div>
    <button class="big" id="trDone">Done</button>`);
  const move=(sku,d)=>{
    const day=state.tradeDate;
    if(d>0 && homeQty(sku)<=0){ toast('Nothing left at home for that line — add stock in Inventory'); return; }
    if(d<0 && trolleyQty(sku)<=0) return;
    addMove({day, sku, loc:'home', qty:-d, type:'transfer', ref:'trolley-'+day, note:state.event||''});
    addMove({day, sku, loc:'trolley', qty:d, type:'transfer', ref:'trolley-'+day, note:state.event||''});
    save(); openTrolleySheet(); renderTally();
  };
  document.querySelectorAll('[data-tp]').forEach(b=>b.onclick=()=>move(b.dataset.tp,1));
  document.querySelectorAll('[data-tm]').forEach(b=>b.onclick=()=>move(b.dataset.tm,-1));
  document.getElementById('trAll').onclick=()=>{ ui.invAll=!ui.invAll; openTrolleySheet(); };
  document.getElementById('trDone').onclick=()=>{ closeSheet(); renderMain(); };
  document.getElementById('trHome').onclick=()=>{
    const day=state.tradeDate; let n=0;
    state.products.forEach(p=>{ const t=trolleyQty(p.sku); if(t>0){
      addMove({day, sku:p.sku, loc:'trolley', qty:-t, type:'transfer', ref:'return-'+day, note:'brought home'});
      addMove({day, sku:p.sku, loc:'home', qty:t, type:'transfer', ref:'return-'+day, note:'brought home'});
      n+=t; }});
    save(); closeSheet(); render(); toast(`${n} pieces back in home stock`);
  };
  document.getElementById('trCopy').onclick=()=>{
    const prev=[...new Set(state.moves.filter(m=>m.type==='transfer'&&m.loc==='trolley'&&m.qty>0&&m.day!==state.tradeDate).map(m=>m.day))].sort().pop();
    if(!prev) return toast('No earlier load to copy');
    const day=state.tradeDate; let n=0;
    const want={};
    state.moves.filter(m=>m.day===prev&&m.loc==='trolley'&&m.qty>0).forEach(m=>{ want[m.sku]=(want[m.sku]||0)+m.qty; });
    Object.entries(want).forEach(([sku,q])=>{
      const take=Math.min(q, Math.max(0,homeQty(sku)));
      if(take>0){
        addMove({day, sku, loc:'home', qty:-take, type:'transfer', ref:'trolley-'+day});
        addMove({day, sku, loc:'trolley', qty:take, type:'transfer', ref:'trolley-'+day});
        n+=take;
      }
    });
    save(); openTrolleySheet(); renderTally();
    toast(n?`${n} pieces loaded, copied from ${dayLabel(prev)}`:'Nothing at home to load');
  };
}

const saleGross = () => state.sale.reduce((s,l)=>s+l.price*l.qty,0);
const saleFull  = () => state.sale.reduce((s,l)=>s+(l.list!=null?l.list:l.price)*l.qty,0);

function saleTotal(){
  const g=saleGross(), m=state.saleMeta;
  if(m.finalTotal!=null && !isNaN(m.finalTotal)) return Math.max(0,m.finalTotal);
  if(m.discPct) return round2(g*(1-m.discPct/100));
  return g;
}

/* ---------------- completing a sale ---------------- */
function postSaleMoves(sale){
  const loc=(sale.channel==='Online')?'home':'trolley';
  sale.lines.forEach(l=>{
    const p=bySku(l.sku);
    if(p && p.noStock) return;
    addMove({day:sale.day, sku:l.sku, loc, qty:-l.qty, type:'sale', ref:sale.id,
             note:(sale.channel||'Market')+(sale.event?' · '+sale.event:'')});
  });
}
function completeSale(method){
  if(!state.sale.length) return;
  const now=new Date();
  const gross=saleGross(), target=saleTotal(), full=saleFull();
  const lines=state.sale.map(l=>({...l, list:(l.list!=null?l.list:l.price)}));
  if(gross>0 && Math.abs(target-gross)>0.004){
    const f=target/gross;
    lines.forEach(l=>{ l.price=round2(l.price*f); });
    const sum=lines.reduce((n,l)=>n+l.price*l.qty,0), diff=round2(target-sum);
    if(Math.abs(diff)>=0.01){ const last=lines[lines.length-1]; last.price=round2(last.price+diff/last.qty); }
  }
  const sale={ id:uid(), ts:now.toISOString(), day:state.tradeDate, time:now.toTimeString().slice(0,5),
    channel:'Market', event:state.event||'Market', method, total:round2(target),

/* ---------------- CSV / Excel plumbing ---------------- */
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','||c==='\t'){ row.push(cur); cur=''; }
    else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if(c!=='\r') cur+=c;
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function toObjects(rows){
  if(!rows.length) return [];
  const head=rows[0].map(h=>String(h).trim());
  return rows.slice(1).map(r=>{ const o={}; head.forEach((h,i)=>o[h]=r[i]!==undefined?String(r[i]).trim():''); return o; });
}
function pick(o, names){
  const keys=Object.keys(o);
  for(const n of names){ const k=keys.find(k=>norm(k)===norm(n)); if(k && o[k]!=='') return o[k]; }
  return '';
}
function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s);
  });
}
async function readAny(file){
  if(/\.xlsx?$/i.test(file.name)){
    if(!window.XLSX){
      try{ await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'); }
      catch(e){ throw new Error('Excel files need an internet connection. Save the sheet as CSV and it will work anywhere.'); }
    }
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    return XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]);
  }
  return await file.text();
}
function pickFile(cb){
  const inp=document.getElementById('filePick');
  inp.value='';
  inp.onchange=async ()=>{
    const f=inp.files[0]; if(!f) return;
    try{ cb(await readAny(f), f.name); }
    catch(e){ toast(e.message||'Could not read that file'); }
  };
  inp.click();
}
function download(name, text, type){
  try{
    const blob=new Blob([text],{type:type||'text/plain'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
    toast('Saved to your downloads');
  }catch(e){ toast('Download blocked here — use the copy box instead'); }
}
const csvCell = v => '"'+String(v??'').replace(/"/g,'""')+'"';
const csvOfRows = rows => rows.map(r=>r.map(csvCell).join(',')).join('\n');
function parseDay(str){
  const s=String(str||'').trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(m){ const y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`; }
  return null;
}
/* find a stock line from whatever the file calls it */
function matchSku(sku, name, variant){
  if(sku){ const p=state.products.find(p=>norm(p.sku)===norm(sku)); if(p) return p; }
  const n=norm(name), v=norm(variant||'');
  if(!n) return null;
  let p=state.products.find(p=>norm(p.name)===n && norm(p.variant)===v);
  if(p) return p;
  p=state.products.find(p=>norm(fullName(p))===norm((name||'')+(variant?' '+variant:'')));
  if(p) return p;
  if(!variant){                                   // "Title - Variant" in one field
    p=state.products.find(p=>norm(fullName(p))===n);
    if(p) return p;
  }
  return null;
}
function renameSku(oldSku, newSku){
  if(!oldSku || !newSku || oldSku===newSku) return;
  state.moves.forEach(m=>{ if(m.sku===oldSku) m.sku=newSku; });
  state.sales.forEach(s=>s.lines.forEach(l=>{ if(l.sku===oldSku) l.sku=newSku; }));
  _stockVer++;
}
function addBatch(kind, note, n){
  const b={id:uid(), kind, note, n, at:new Date().toISOString(), day:todayKey()};
  state.batches.unshift(b); return b.id;
}
function tombstone(kind, ids){
  const at=Date.now();
  ids.forEach(id=>{ if(id && !state.deleted[kind].some(x=>x.id===id)) state.deleted[kind].push({id,at}); });
}
function untomb(kind, ids){ state.deleted[kind]=state.deleted[kind].filter(x=>!ids.includes(x.id)); }
function undoBatch(id){
  const b=state.batches.find(x=>x.id===id); if(!b) return;
  const saleIds=state.sales.filter(s=>s.batch===id).map(s=>s.id);
  const moveIds=state.moves.filter(m=>m.batch===id||saleIds.includes(m.ref)).map(m=>m.id);
  const countIds=state.counts.filter(c=>c.batch===id).map(c=>c.id);
  tombstone('sales',saleIds); tombstone('moves',moveIds);
  tombstone('counts',countIds); tombstone('batches',[id]);
  state.sales=state.sales.filter(s=>s.batch!==id);
  state.moves=state.moves.filter(m=>m.batch!==id && !saleIds.includes(m.ref));
  state.counts=state.counts.filter(c=>c.batch!==id);
  state.batches=state.batches.filter(x=>x.id!==id);
  save(); render(); toast('Import undone');
}

/* ---------------- PRODUCTS: master data ---------------- */
const PROD_COLS=['SKU','Name','Variant','Category','Group','Market price','Web price','Cost','Reorder level','Active'];
function productsCSV(){
  return csvOfRows([PROD_COLS].concat(state.products.map(p=>
    [p.sku,p.name,p.variant,p.cat,p.group,p.price,p.web,p.cost||0,p.reorder||0,p.active===false?'no':'yes'])));
}
function importProducts(text){
  const rows=toObjects(parseCSV(text));
  if(!rows.length) return toast('That file had no rows');
  const prepared=[]; let bad=0, added=0, updated=0, renamed=0;
  const claimed=new Set();
  rows.forEach(r=>{
    const sku=pick(r,['SKU','sku','Variant SKU']);
    const name=pick(r,['Name','Product','Title','Product name']);
    if(!sku && !name){ bad++; return; }
    const variant=pick(r,['Variant','Option','Option1 Value','Colour','Color','Type']);
    let existing = sku ? state.products.find(p=>norm(p.sku)===norm(sku)) : null;
    let rename=false;
    if(!existing){                                   // no SKU match — is it the same piece under a new code?
      const byName=matchSku('',name,variant);
      if(byName && !claimed.has(byName.sku)){ existing=byName; rename=!!sku; }
    }
    if(existing) claimed.add(existing.sku);
    if(existing){ updated++; if(sku && existing.sku!==sku.toUpperCase()) renamed++; } else added++;
    prepared.push({r, sku, name, variant, existing, rename});
  });
  const keep=new Set(prepared.filter(x=>x.existing).map(x=>x.existing.sku));
  const orphans=state.products.filter(p=>!keep.has(p.sku));
  const orphanHeld=orphans.filter(p=>onHand(p.sku,'all',null)!==0 || state.sales.some(s=>s.lines.some(l=>l.sku===p.sku)));
  const orphanFree=orphans.filter(p=>!orphanHeld.includes(p));

  openSheet(`
    <h3>Products — check before importing</h3>
    <div class="meta">${rows.length} rows read${bad?` · ${bad} skipped (no SKU or name)`:''}</div>
    <div class="kpi">
      <div><span>New lines</span><strong class="num">${added}</strong></div>
      <div><span>Updated</span><strong class="num">${updated}</strong><small>${renamed} getting a new SKU</small></div>
      <div><span>Not in the file</span><strong class="num">${orphans.length}</strong><small>${orphanHeld.length} hold stock or history</small></div>
      <div><span>Lines after</span><strong class="num">${state.products.length+added}</strong><small>if you update and add</small></div>
    </div>
    ${renamed?`<div class="warn">${renamed} line(s) matched by name rather than SKU, so their code will change to the one in your file. Their stock and sales history moves across with them.</div>`:''}
    <div class="lbl">First few rows</div>
    <table>${prepared.slice(0,6).map(x=>`<tr><td>${esc(x.name)}${x.variant?' — '+esc(x.variant):''}</td>
      <td class="n">${esc(x.sku||'—')}</td>
      <td class="n">${x.existing?(x.rename?'recode':'update'):'new'}</td></tr>`).join('')}</table>
    ${prepared.filter(x=>(pick(x.r,['Active'])||'yes').toLowerCase().startsWith('n')).length?
      `<div class="warn">${prepared.filter(x=>(pick(x.r,['Active'])||'yes').toLowerCase().startsWith('n')).length} row(s) marked <b>Active = no</b> will be deleted, unless they hold stock or have been sold — those are retired instead.</div>`:''}
    <button class="big" id="ipGo">Update and add</button>
    <button class="ghost danger" id="ipReplace">Replace the whole list</button>
    <div style="font-size:12px;color:var(--ink-soft);margin-top:8px">
      Replacing removes the ${orphanFree.length} line(s) missing from your file that have never been sold and hold no stock.
      The other ${orphanHeld.length} are retired instead, so your history and stock figures stay whole.
    </div>
    <button class="ghost" id="ipCancel">Cancel</button>`);
  document.getElementById('ipCancel').onclick=closeSheet;
  const run=replace=>{
    const batch=addBatch('products','Product master data', prepared.length);
    const isNo = x => (pick(x.r,['Active'])||'yes').toLowerCase().startsWith('n');
    const ordered = prepared.filter(x=>!isNo(x)).concat(prepared.filter(isNo));   // active rows first
    const written = new Set();
    ordered.forEach(({r,sku,name,variant,existing,rename})=>{
      const catRaw=pick(r,['Category','Material']);
      const row={
        sku: (sku || (existing?existing.sku:(norm(name).slice(0,6).toUpperCase()+'-'+uid().slice(0,3)))).toUpperCase(),
        name: name || (existing?existing.name:'Untitled'),
        variant: variant!==''?variant:(existing?existing.variant:''),
        cat: catRaw ? (catRaw.toLowerCase().startsWith('res')?'Resin':'Wood') : (existing?existing.cat:'Wood'),
        group: pick(r,['Group','Type group','Collection','Product type']) || (existing?existing.group:'Wood Figurines'),
        price: parseFloat(pick(r,['Market price','Price','Market'])) || (existing?existing.price:0),
        web: parseFloat(pick(r,['Web price','Website price','Online price'])) || (existing?existing.web:0),
        cost: parseFloat(pick(r,['Cost','Materials cost','Cost each'])) || (existing?existing.cost:0),
        reorder: parseInt(pick(r,['Reorder level','Reorder','Min']),10) || (existing?existing.reorder:0),
        active: (pick(r,['Active'])||'yes').toLowerCase().startsWith('n') ? false : true,
        optLabel: existing?existing.optLabel:'Option',
        pid: existing?existing.pid:('pid-'+norm(name||'x').slice(0,14)),
        noStock: existing?existing.noStock:false, batch
      };
      const held = existing && (onHand(existing.sku,'all',null)!==0 ||
                    state.sales.some(sl=>sl.lines.some(l=>l.sku===existing.sku)));
      if(!row.active){
        // a row marked "no" never overrides a line an active row in the same file has just written
        if(existing && written.has(existing.sku)) return;
        if(written.has(row.sku)) return;
        if(!held){ if(existing) state.products=state.products.filter(x=>x.sku!==existing.sku); return; }
      }
      touch(row); written.add(row.sku);
      if(existing){ if(existing.sku!==row.sku) renameSku(existing.sku, row.sku); Object.assign(existing,row); }
      else state.products.push(row);
    });
    let retired=0, dropped=0;
    if(replace){
      orphanHeld.forEach(p=>{ if(p.active!==false){ p.active=false; touch(p); retired++; } });
      const drop=new Set(orphanFree.map(p=>p.sku));
      dropped=drop.size;
      state.products=state.products.filter(p=>!drop.has(p.sku));
    }
    save(); closeSheet(); render();
    toast(replace ? `List replaced · ${prepared.length} lines in, ${retired} retired, ${dropped} removed`
                  : `${prepared.length} product lines imported`);
  };
  document.getElementById('ipGo').onclick=()=>run(false);
  document.getElementById('ipReplace').onclick=()=>run(true);
}

               cost:round2(parseFloat(document.getElementById('kCost').value)||0)};

  document.querySelectorAll('[data-mm]').forEach(b=>b.onclick=()=>{ const s=b.dataset.mm; draft[s]=Math.max(0,(draft[s]||0)-1); paint(s); });
  document.getElementById('mkSave').onclick=()=>{
    const entries=Object.entries(draft).filter(([,q])=>q>0);
    if(!entries.length){ closeSheet(); return; }
    const batch=addBatch('make','Stock made', entries.length);
    entries.forEach(([sku,q])=>addMove({day:d, sku, loc:'home', qty:q, type:'make', ref:'make-'+d, batch}));
    save(); closeSheet(); render(); toast(`${entries.reduce((n,[,q])=>n+q,0)} pieces added to home stock`);
  };
}
function openCountSheet(scope){

  if(!scope){
    openSheet(`
      <h3>Cycle count</h3>

      <div class="lbl">What are you counting?</div>

    return;
  }
  const lines=state.products.filter(p=>!p.noStock && (scope==='__all'||p.group===scope));
  openSheet(`
    <h3>Counting ${scope==='__all'?'everything':esc(scope)}</h3>

    <div style="max-height:58vh;overflow:auto">
      ${lines.map(p=>`<div class="ln">
        <div class="t"><b>${esc(fullName(p))}</b><span>${p.sku} · expected ${onHand(p.sku,'home',d)} home · ${onHand(p.sku,'trolley',d)} trolley</span></div>
        <input class="field num" data-c="${p.sku}" inputmode="numeric" placeholder="home" style="width:64px;margin:0">
        <input class="field num" data-t="${p.sku}" inputmode="numeric" placeholder="troll" style="width:64px;margin:0">
      </div>`).join('')}
    </div>
    <button class="big" id="cnSave">Save count</button>
    <button class="ghost" id="cnCancel">Cancel</button>`);
  document.getElementById('cnCancel').onclick=closeSheet;
  document.getElementById('cnSave').onclick=()=>{
    const batch=addBatch('count','Cycle count · '+(scope==='__all'?'everything':scope), lines.length);
    let n=0, varUnits=0, varValue=0;
    lines.forEach(p=>{
      [['home','c'],['trolley','t']].forEach(([loc,attr])=>{
        const el=document.querySelector(`[data-${attr}="${p.sku}"]`);
        if(!el || el.value.trim()==='') return;
        const counted=parseInt(el.value,10); if(isNaN(counted)) return;
        const expect=onHand(p.sku,loc,d), diff=counted-expect;
        n++;
        if(diff!==0){
          varUnits+=diff; varValue+=diff*(+p.cost||0);
          addMove({day:d, sku:p.sku, loc, qty:diff, type:'count', ref:'count-'+d, batch,
                   note:`counted ${counted}, expected ${expect}`});
        }
      });
    });
    state.counts.unshift({id:uid(), day:d, scope:(scope==='__all'?'Everything':scope), lines:n,
                          varUnits, varValue, batch});
    save(); closeSheet(); render();
    toast(n?`${n} lines counted · variance ${varUnits>0?'+':''}${varUnits} pieces`:'Nothing counted');
  };
}
function importCounts(text){
  const rows=toObjects(parseCSV(text));
  if(!rows.length) return toast('That file had no rows');
  const parsed=[];
  let unmatched=0;
  rows.forEach(r=>{
    const sku=pick(r,['SKU','sku','Variant SKU']);
    const name=pick(r,['Line','Name','Product','Title']);
    const variant=pick(r,['Variant','Option','Colour','Type']);
    const p=matchSku(sku,name,variant);
    const qty=parseInt(pick(r,['Counted qty','Qty','Quantity','Count','On hand','Stock']),10);
    const loc=(pick(r,['Location','Where'])||'home').toLowerCase().startsWith('tro')?'trolley':'home';
    const day=parseDay(pick(r,['Date','As at','Count date']))||invDate();
    if(!p || isNaN(qty)){ unmatched++; return; }
    parsed.push({p,qty,loc,day});
  });
  openSheet(`
    <h3>Stock counts — check before importing</h3>
    <div class="meta">${rows.length} rows read · ${parsed.length} matched${unmatched?` · ${unmatched} could not be matched to a line`:''}</div>
    <div class="warn">Each row sets the on-hand figure for that line on that date. The difference against what the app expected is posted as a count adjustment, so your history stays intact.</div>
    <table>${parsed.slice(0,6).map(x=>`<tr><td>${esc(fullName(x.p))}</td><td class="n">${x.loc}</td>
      <td class="n num">${onHand(x.p.sku,x.loc,x.day)} → ${x.qty}</td></tr>`).join('')}</table>
    <button class="big" id="icGo">Import ${parsed.length} counts</button>
    <button class="ghost" id="icCancel">Cancel</button>`);
  document.getElementById('icCancel').onclick=closeSheet;
  document.getElementById('icGo').onclick=()=>{
    const batch=addBatch('count','Uploaded counts', parsed.length);
    let varUnits=0, varValue=0;
    const byDay={};
    parsed.forEach(({p,qty,loc,day})=>{
      const expect=onHand(p.sku,loc,day), diff=qty-expect;
      if(diff!==0){
        varUnits+=diff; varValue+=diff*(+p.cost||0);
        addMove({day, sku:p.sku, loc, qty:diff, type:'count', ref:'import-'+day, batch,
                 note:`uploaded count ${qty}, expected ${expect}`});
      }
      byDay[day]=(byDay[day]||0)+1;
    });
    Object.entries(byDay).forEach(([day,n])=>
      state.counts.unshift({id:uid(), day, scope:'Uploaded file', lines:n, varUnits, varValue, batch}));
    save(); closeSheet(); render(); toast(`${parsed.length} counts imported`);
  };
}

/* ---------------- ONLINE: Shopify orders export ---------------- */
function importShopify(text){
  const rows=toObjects(parseCSV(text));
  if(!rows.length) return toast('That file had no rows');
  const orders=new Map();
  let skipped=0;
  rows.forEach(r=>{
    const name=pick(r,['Name','Order','Order name']);
    if(!name) { skipped++; return; }
    const o=orders.get(name)||{name, day:null, status:'', lines:[], ship:0, total:0};
    const created=pick(r,['Created at','Paid at','Processed at']);
    if(created && !o.day) o.day=parseDay(created);
    const st=pick(r,['Financial Status','Financial status']); if(st) o.status=st.toLowerCase();
    const qty=parseInt(pick(r,['Lineitem quantity','Quantity']),10);
    const liName=pick(r,['Lineitem name','Product','Title']);
    if(qty>0 && liName){
      const sku=pick(r,['Lineitem sku','SKU']);
      let title=liName, variant='';
      const dash=liName.lastIndexOf(' - ');
      if(dash>0){ title=liName.slice(0,dash); variant=liName.slice(dash+3); }
      const price=parseFloat(pick(r,['Lineitem price','Price']))||0;
      const disc=parseFloat(pick(r,['Lineitem discount','Discount']))||0;
      o.lines.push({sku, title, variant, qty, price, disc, raw:liName});
    }
    orders.set(name,o);
  });
  const existing=new Set(state.sales.filter(s=>s.orderRef).map(s=>s.orderRef));
  const prepared=[], dupes=[], voided=[], unmatched=[];
  orders.forEach(o=>{
    if(!o.lines.length) return;
    if(existing.has(o.name)){ dupes.push(o.name); return; }
    if(/refund|void|cancel/.test(o.status)){ voided.push(o.name); return; }
    const lines=o.lines.map(l=>{
      const p=matchSku(l.sku,l.title,l.variant) || matchSku('',l.raw,'');
      if(!p) unmatched.push(l.raw);
      return {sku:p?p.sku:'', pid:p?p.pid:'', name:p?p.name:l.title, variant:p?p.variant:l.variant,
              cat:p?p.cat:'Wood', group:p?p.group:'Unmatched',
              qty:l.qty, price:round2(l.price-(l.disc/Math.max(1,l.qty))), list:l.price, matched:!!p};
    });
    prepared.push({o, lines, total:round2(lines.reduce((n,l)=>n+l.price*l.qty,0))});
  });
  const value=prepared.reduce((n,x)=>n+x.total,0);
  openSheet(`
    <h3>Shopify orders — check before importing</h3>
    <div class="meta">${orders.size} orders in the file.</div>
    <div class="kpi">
      <div><span>To import</span><strong class="num">${prepared.length}</strong><small>${money(value)}</small></div>
      <div><span>Already in</span><strong class="num">${dupes.length}</strong><small>skipped</small></div>
      <div><span>Refunded / void</span><strong class="num">${voided.length}</strong><small>skipped</small></div>
      <div><span>Unmatched lines</span><strong class="num">${unmatched.length}</strong><small>${unmatched.length?'imported, no stock move':'all matched'}</small></div>
    </div>
    ${unmatched.length?`<div class="warn">These didn't match a stock line, so they'll be recorded as sales but won't move stock:<br>${[...new Set(unmatched)].slice(0,6).map(esc).join('<br>')}</div>`:''}
    <div style="font-size:12px;color:var(--ink-soft);margin-top:8px">Shipping and tax are left out — this records what the pieces sold for. Online sales come out of home stock.</div>
    <button class="big" id="shGo">Import ${prepared.length} orders</button>
    <button class="ghost" id="shCancel">Cancel</button>`);
  document.getElementById('shCancel').onclick=closeSheet;
  document.getElementById('shGo').onclick=()=>{
    if(!prepared.length){ closeSheet(); return toast('Nothing new to import'); }
    const batch=addBatch('online','Shopify orders', prepared.length);
    prepared.forEach(({o,lines,total})=>{
      const sale={ id:uid(), ts:new Date().toISOString(), day:o.day||todayKey(), time:'',
        channel:'Online', event:'Online', method:'Card', orderRef:o.name,
        total, gross:round2(lines.reduce((n,l)=>n+(l.list||l.price)*l.qty,0)),
        discount:round2(lines.reduce((n,l)=>n+((l.list||l.price)-l.price)*l.qty,0)),
        lines:lines.map(({matched,...l})=>l), customer:'', note:'', followUp:false, done:false,
        age:'', ctype:'', pack:null, batch };
      state.sales.push(sale);
      sale.lines.forEach(l=>{ if(l.sku) addMove({day:sale.day, sku:l.sku, loc:'home', qty:-l.qty,
        type:'sale', ref:sale.id, batch, note:'Online · '+o.name}); });
    });
    sortSales(); save(); closeSheet(); render();
    toast(`${prepared.length} online orders imported`);
  };
}

/* ---------------- dashboard maths ---------------- */
function sessionsList(){
  const map=new Map();
  state.sales.filter(s=>(s.channel||'Market')!=='Online').forEach(s=>{
    const ev=s.event||'Market', k=s.day+'||'+ev;
    if(!map.has(k)) map.set(k,{key:k,day:s.day,event:ev,sales:[]});
    map.get(k).sales.push(s);
  });
  return [...map.values()].sort((a,b)=>a.day<b.day?1:a.day>b.day?-1:0);
}
function currentSession(){
  const l=sessionsList();
  return l.find(s=>s.day===state.tradeDate&&s.event===(state.event||'Market'))||l[0]||null;
}
function monthTotals(y){
  const out=Array(12).fill(0);
  state.sales.forEach(s=>{ if(+s.day.slice(0,4)===+y) out[+s.day.slice(5,7)-1]+=s.total; });
  return out;
}
function yearTo(y,cut){ return state.sales.filter(s=>+s.day.slice(0,4)===+y&&s.day.slice(5)<=cut).reduce((n,s)=>n+s.total,0); }
function profitOf(list){
  const t=totalsOf(list);
  const packing=list.reduce((n,s)=>n+(s.pack?(+s.pack.cost||0):0),0);
  const goods=list.reduce((n,s)=>n+s.lines.reduce((m,l)=>{const p=bySku(l.sku); return m+((p&&p.cost?+p.cost:0)*l.qty);},0),0);
  const keys=[...new Set(list.filter(s=>(s.channel||'Market')!=='Online').map(s=>sessionKey(s.day,s.event)))];
  const fixed=keys.reduce((n,k)=>n+costTotal(k),0);
  const costs=packing+goods+fixed;
  return {takings:t.total,packing,goods,fixed,costs,net:t.total-costs,margin:t.total?(t.total-costs)/t.total*100:0};
}
function delta(now,prev){
  if(!prev) return '<span class="delta flat">no comparison</span>';
  const pc=(now-prev)/prev*100, cls=pc>0.5?'up':pc<-0.5?'down':'flat', a=pc>0.5?'▲':pc<-0.5?'▼':'=';
  return `<span class="delta ${cls}">${a} ${Math.abs(pc).toFixed(0)}%</span>`;
}

/* ---------------- merging two devices ---------------- */
function normaliseIncoming(d){
  const legacy = !d.v || d.v<4 || (Array.isArray(d.products)&&d.products[0]&&!d.products[0].sku);
  if(legacy){
    (d.sales||[]).forEach(s=>{
      s.channel=s.channel||'Market';
      s.lines=(s.lines||[]).map(l=>{ const p=matchSku('',l.name,l.variant); return {...l, sku:p?p.sku:''}; });
    });
    d.products=null; d.moves=null; d.counts=null;      // the old app had no stock ledger
  }
  return legacy;
}
/* union by key, newest edit wins, anything deleted on either side stays deleted */
function mergeBackup(d, dry){
  const st={salesNew:0,salesUpd:0,movesNew:0,countsNew:0,batchNew:0,prodNew:0,prodUpd:0,
            marketsNew:0,wishNew:0,costsNew:0,dropped:0};
  const dIn=d.deleted||{};
  const graves={};
  ['sales','moves','counts','batches'].forEach(k=>{
    graves[k]=new Set([...(state.deleted[k]||[]).map(x=>x.id), ...((dIn[k]||[]).map(x=>x.id))]);
  });
  const apply=[];

  const unionById=(key, graveKey)=>{
    const incoming=d[key]; if(!Array.isArray(incoming)) return;
    const mine=new Map(state[key].map(x=>[x.id,x]));
    incoming.forEach(x=>{
      if(!x || !x.id) return;
      if(graves[graveKey] && graves[graveKey].has(x.id)){ st.dropped++; return; }
      const have=mine.get(x.id);
      if(!have){ apply.push(()=>state[key].push(x)); if(key==='sales') st.salesNew++; else if(key==='moves') st.movesNew++;
                 else if(key==='counts') st.countsNew++; else st.batchNew++; }
      else if((x.upd||0) > (have.upd||0)){ apply.push(()=>Object.assign(have,x)); if(key==='sales') st.salesUpd++; }
    });
  };
  unionById('sales','sales'); unionById('moves','moves');
  unionById('counts','counts'); unionById('batches','batches');

  // anything the other device deleted goes here too
  ['sales','moves','counts','batches'].forEach(k=>{
    const gone=(dIn[k]||[]).map(x=>x.id);
    if(!gone.length) return;
    apply.push(()=>{
      state[k]=state[k].filter(x=>!gone.includes(x.id));
      gone.forEach(id=>{ if(!state.deleted[k].some(y=>y.id===id)) state.deleted[k].push({id,at:Date.now()}); });
    });
  });

  if(Array.isArray(d.products)){
    const mine=new Map(state.products.map(p=>[p.sku,p]));
    d.products.forEach(p=>{
      if(!p||!p.sku) return;
      const have=mine.get(p.sku);
      if(!have){ apply.push(()=>state.products.push(p)); st.prodNew++; }
      else if((p.upd||0)>(have.upd||0)){ apply.push(()=>Object.assign(have,p)); st.prodUpd++; }
    });
  }
  (d.markets||[]).forEach(m=>{ if(!state.markets.includes(m)){ apply.push(()=>state.markets.push(m)); st.marketsNew++; } });
  (d.wishes||[]).forEach(w=>{
    if(!w||!w.id) return;
    const have=state.wishes.find(x=>x.id===w.id);
    if(!have){ apply.push(()=>state.wishes.push(w)); st.wishNew++; }
    else apply.push(()=>{ have.count=Math.max(have.count||0,w.count||0); have.done=have.done||w.done; });
  });
  Object.entries(d.costs||{}).forEach(([k,v])=>{
    if(!state.costs[k]){ apply.push(()=>state.costs[k]=v); st.costsNew++; }
  });

  if(!dry){
    apply.forEach(f=>f());
    sortSales(); _stockVer++; save();
  }
  return st;
}
function restoreJSON(text){

    const r=mergeBackup(d,false);
    closeSheet(); render();
    toast(`Merged · ${r.salesNew} new sales, ${r.movesNew} stock moves`);
  };
  document.getElementById('rsReplace').onclick=()=>{
    KEEP.forEach(k=>{ if(d[k]!==undefined && d[k]!==null) state[k]=d[k]; });
    if(!state.deleted) state.deleted={sales:[],moves:[],counts:[],batches:[]};
    sortSales(); _stockVer++; save(); closeSheet(); render();
    toast(`Replaced · ${state.sales.length} sales on this device`);
  };
}

/* ---------------- paper records ---------------- */
function openPaperSheet(){
  openSheet(`
    <h3>Type up paper records</h3>
    <div class="meta">One line per item sold. Commas or tabs. Only the date and the piece are needed.</div>
    <div class="note" style="margin-top:0">date, market, piece, variant, qty, price each, cash or card, age range, new or returning
      <br><br><b>Example</b><br>30/11/2025, Christmas Fair, Jingle Along Resin Figure, Apricot, 2, 5, cash, 25-34, New</div>
    <textarea class="field" id="pBox" rows="9" placeholder="30/11/2025, Christmas Fair, The Little Sniffer, , 1, 22, cash, 35-44, New"></textarea>
    <div id="pPrev" style="font-size:13px;color:var(--ink-soft);margin-top:8px"></div>
    <button class="big" id="pGo">Check and add</button>
    <button class="ghost" id="pCancel">Cancel</button>`);
  const parse=text=>{
    const out=[], bad=[];
    text.split(/\r?\n/).forEach(line=>{
      if(!line.trim()) return;
      const f=line.split(/\t|,/).map(x=>x.trim());
      const day=parseDay(f[0]);
      if(!day||f.length<3){ bad.push(line); return; }
      const p=matchSku('',f[2],f[3]||'');
      const qty=parseInt(f[4],10)||1;
      const price=f[5]!==''&&f[5]!==undefined?parseFloat(f[5]):(p?p.price:0);
      const pay=(f[6]||'').toLowerCase();
      const method=pay.startsWith('car')?'Card':'Cash';
      out.push({day, event:f[1]||'Market', p, name:f[2], variant:f[3]||'', qty,
        price:isNaN(price)?0:price, method, age:AGES.find(a=>norm(a)===norm(f[7]))||'',
        ctype:CUSTS.find(c=>norm(c)===norm(f[8]))||''});
    });
    return {out,bad};
  };
  const box=document.getElementById('pBox'), prev=document.getElementById('pPrev');
  let parsed=null;
  box.oninput=()=>{
    parsed=parse(box.value);
    const nomatch=parsed.out.filter(x=>!x.p).length;
    prev.innerHTML=box.value.trim()?`${parsed.out.length} line(s) understood${nomatch?` · ${nomatch} not matched to a stock line (recorded, but no stock movement)`:''}${parsed.bad.length?` · <b class="danger">${parsed.bad.length} unreadable</b>`:''}`:'';
  };
  document.getElementById('pCancel').onclick=closeSheet;
  document.getElementById('pGo').onclick=()=>{
    const r=parsed||parse(box.value);
    if(!r.out.length) return toast('Nothing readable — check the date comes first');
    const batch=addBatch('paper','Typed-up paper records', r.out.length);
    r.out.forEach(x=>{
      const sale={ id:uid(), ts:new Date().toISOString(), day:x.day, time:'', channel:'Market',
        event:x.event, method:x.method, total:round2(x.price*x.qty), gross:round2(x.price*x.qty), discount:0,
        lines:[{sku:x.p?x.p.sku:'', pid:x.p?x.p.pid:'', name:x.p?x.p.name:x.name, variant:x.p?x.p.variant:x.variant,
                cat:x.p?x.p.cat:'Wood', group:x.p?x.p.group:'Unmatched', qty:x.qty, price:x.price, list:x.price}],
        customer:'', note:x.p?'':'Typed from paper — not matched to a stock line',
        followUp:false, done:false, age:x.age, ctype:x.ctype, pack:null, batch };
      state.sales.push(sale);
      if(x.p) addMove({day:x.day, sku:x.p.sku, loc:'trolley', qty:-x.qty, type:'sale', ref:sale.id, batch, note:'paper record'});
      if(x.event && !state.markets.includes(x.event)) state.markets.push(x.event);
    });
    sortSales(); save(); closeSheet(); render();
    toast(`${r.out.length} past sales added`,'Undo',()=>undoBatch(batch));
  };
}

/* ---------------- render ---------------- */
function renderMain(){
  const m=document.getElementById('main');
  if(ui.tab==='sell'){ m.innerHTML=viewSell(); bindSell(); }
  else if(ui.tab==='online'){ m.innerHTML=viewOnline(); bindOnline(); }
  else if(ui.tab==='records'){ m.innerHTML=viewRecords(); bindRecords(); }
  else if(ui.tab==='inventory'){ m.innerHTML=viewInventory(); bindInventory(); }
  else if(ui.tab==='dash'){ m.innerHTML=viewDash(); bindDash(); }
  else { m.innerHTML=viewProducts(); bindProducts(); }
}
function render(){ renderTally(); renderMain(); renderBar(); }

document.getElementById('veil').onclick=closeSheet;
document.getElementById('evtBtn').onclick=openMarketSheet;
document.getElementById('payCash').onclick=()=>completeSale('Cash');
document.getElementById('payCard').onclick=()=>completeSale('Card');
document.getElementById('toggleLines').onclick=()=>{ ui.showLines=!ui.showLines; renderBar(); };
document.getElementById('clearSale').onclick=()=>{
  const backup=state.sale.slice(), meta={...state.saleMeta};
  state.sale=[]; state.saleMeta=blankMeta(); save(); renderBar(); renderMain();
  toast('Sale cleared','Undo',()=>{ state.sale=backup; state.saleMeta=meta; save(); renderBar(); renderMain(); });
};
document.getElementById('tdate').onchange=e=>{
  state.tradeDate=e.target.value||todayKey(); ui.invDate=''; ui.cmpA=''; ui.cmpB=''; save(); render();
  if(state.tradeDate!==todayKey()) toast('Sales will be filed under '+dayLabel(state.tradeDate));
};
document.getElementById('todayBtn').onclick=()=>{ state.tradeDate=todayKey(); ui.invDate=''; save(); render(); };

(async function init(){
  await loadState();
  render();
})();
</script>
